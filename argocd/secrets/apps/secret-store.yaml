# How obs-agent reaches its secrets: ESO -> OpenBao, KV v2 at secret/obs-agent/*. Written 2026-11-09.
# Least privilege: only namespace obs-agent may use this store, and OpenBao's role (bootstrap/openbao-init.sh)
# lets ESO's service account read secret/data/obs-agent/* and nothing else.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: obs-agent-secrets}
spec:
  conditions: [{namespaces: [obs-agent]}]
  provider:
    vault:
      server: https://openbao.lab-secrets.svc:8200
      path: secret
      version: v2
      caProvider: {type: ConfigMap, name: openshift-service-ca.crt, key: service-ca.crt, namespace: lab-secrets}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-obs-agent
          serviceAccountRef: {name: external-secrets, namespace: external-secrets}
---
# OpenBao answers only ESO and the router (for the UI Route).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: openbao-ingress, namespace: lab-secrets}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: openbao}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: external-secrets}}}]
      ports: [{port: 8200}]
    - from: [{namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}}]
      ports: [{port: 8200}]
