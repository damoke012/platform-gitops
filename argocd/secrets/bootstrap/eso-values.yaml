# External Secrets Operator on the lab (Argo CD Application lab-eso). Chart 2.14.0, image mirrored to Harbor
# and pinned by digest. restricted-v2 assigns the UID, so the chart's fixed runAsUser is removed.
installCRDs: true
global:
  imagePullSecrets: [{name: harbor-pull}]
image: &img
  repository: harbor.apps.lab.ocp.lan/library/external-secrets
  tag: v2.14.0@sha256:518b635ea3912b8fc5bd5fd63801a038249d9d77a48c195cc257085d447603d4
securityContext: &sc
  runAsUser: null
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
  seccompProfile: {type: RuntimeDefault}
webhook:
  image: *img
  securityContext: *sc
certController:
  image: *img
  securityContext: *sc
