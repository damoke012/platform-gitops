# OpenBao on the lab (Argo CD Application lab-openbao). Chart 0.30.5 = OpenBao 2.7.2, image mirrored to Harbor.
# Standalone, file storage on a PVC, Shamir seal: Dare holds the unseal key shares off the cluster
# (bootstrap/openbao-init.sh). TLS from the OpenShift service CA; ESO verifies it with the injected CA bundle.
global:
  openshift: true
  imagePullSecrets: [{name: harbor-pull}]
injector: {enabled: false}
csi: {enabled: false}
ui: {enabled: true}
server:
  image:
    registry: harbor.apps.lab.ocp.lan
    repository: library/openbao
    tag: 2.7.2@sha256:5bec4d099b1784ea3e2366cf1a1e9977f276d832003b4e10dc2ee223b7c98f82
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
  dataStorage: {enabled: true, size: 2Gi, storageClass: nfs-harbor}
  auditStorage: {enabled: true, size: 1Gi, storageClass: nfs-harbor}
  service:
    annotations: {service.beta.openshift.io/serving-cert-secret-name: openbao-tls}
  volumes: [{name: tls, secret: {secretName: openbao-tls}}]
  volumeMounts: [{name: tls, mountPath: /openbao/tls, readOnly: true}]
  extraEnvironmentVars:
    BAO_CACERT: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
  route:
    enabled: true
    host: openbao.apps.lab.ocp.lan
    tls: {termination: reencrypt}
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address       = "[::]:8200"
        tls_cert_file = "/openbao/tls/tls.crt"
        tls_key_file  = "/openbao/tls/tls.key"
      }
      storage "file" { path = "/openbao/data" }
