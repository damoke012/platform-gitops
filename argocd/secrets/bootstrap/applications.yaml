# Lab secret management, reconciled by Argo CD (openshift-gitops). Written 2026-11-09.
# Applied once by a cluster admin after copying harbor-pull into the two namespaces (README.md).
#   lab-eso             External Secrets Operator 2.14.0 (chart from charts.external-secrets.io)
#   lab-openbao         OpenBao 2.7.2 (chart 0.30.5 from openbao.github.io/openbao-helm)
#   lab-secrets-config  the ClusterSecretStore obs-agent reads through, and OpenBao's NetworkPolicy
# Chart versions are pinned; values live in this repo ($values).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: lab-eso, namespace: openshift-gitops}
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm: {releaseName: external-secrets, valueFiles: [$values/argocd/secrets/bootstrap/eso-values.yaml]}
    - {repoURL: https://github.com/damoke012/platform-gitops.git, targetRevision: main, ref: values}
  destination: {server: https://kubernetes.default.svc, namespace: external-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    managedNamespaceMetadata: {labels: {argocd.argoproj.io/managed-by: openshift-gitops}}
    # ServerSideApply: ESO's CRDs exceed the 256 KB last-applied annotation of client-side apply.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 30s, factor: 2, maxDuration: 10m}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: lab-openbao, namespace: openshift-gitops}
spec:
  project: default
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.30.5
      helm: {releaseName: openbao, valueFiles: [$values/argocd/secrets/bootstrap/openbao-values.yaml]}
    - {repoURL: https://github.com/damoke012/platform-gitops.git, targetRevision: main, ref: values}
  destination: {server: https://kubernetes.default.svc, namespace: lab-secrets}
  # The chart's Route: no ServerSideApply here (Argo CD cannot diff Routes with it; see lab-observability).
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    managedNamespaceMetadata: {labels: {argocd.argoproj.io/managed-by: openshift-gitops}}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 10, backoff: {duration: 30s, factor: 2, maxDuration: 10m}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: lab-secrets-config, namespace: openshift-gitops}
spec:
  project: default
  source: {repoURL: https://github.com/damoke012/platform-gitops.git, targetRevision: main, path: argocd/secrets/apps}
  destination: {server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 10, backoff: {duration: 30s, factor: 2, maxDuration: 10m}}   # waits for ESO's CRDs
