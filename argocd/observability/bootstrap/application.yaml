# Applied once by a cluster admin: oc apply -f argocd/observability/bootstrap/
# From then on Argo CD (openshift-gitops) reconciles argocd/observability/apps from main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-observability
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/damoke012/platform-gitops.git
    targetRevision: main
    path: argocd/observability/apps
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true      # prunes only objects this Application created
      selfHeal: true
    # No ServerSideApply: Argo CD's structured-merge diff has no schema for route.openshift.io Routes
    # and fails the whole comparison ("unable to resolve parseableType ... Kind=Route"). Client-side
    # apply suffices: the dashboards ConfigMap is ~103 KB, under the 256 KB last-applied limit.
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 10m}   # namespace RBAC from managed-by takes a moment
