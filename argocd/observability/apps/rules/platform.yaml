# Workload-type and lab-specific rules: GPU (DCGM), control plane gaps seen on 2026-11-08, logging.
# Evaluated by the platform Prometheus. Kafka rules live in the kafka namespace (bootstrap/), since
# Kafka's JMX metrics are scraped by user-workload monitoring.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: lab-platform, namespace: lab-monitoring}
spec:
  groups:
    - name: lab.gpu
      rules:
        - alert: GPUTemperatureHigh
          expr: max by (Hostname, gpu) (DCGM_FI_DEV_GPU_TEMP) > 80
          for: 10m
          labels: {severity: warning, tier: gpu}
          annotations: {summary: 'GPU {{ $labels.gpu }} on {{ $labels.Hostname }} at {{ $value }} °C'}
        - alert: GPUTemperatureCritical
          expr: max by (Hostname, gpu) (DCGM_FI_DEV_GPU_TEMP) > 88
          for: 2m
          labels: {severity: critical, tier: gpu}
          annotations: {summary: 'GPU {{ $labels.gpu }} on {{ $labels.Hostname }} at {{ $value }} °C: thermal throttling or shutdown next', description: 'The P40 is passively cooled and depends on chassis airflow.'}
        - alert: GPUXidErrors
          expr: max by (Hostname, gpu) (DCGM_FI_DEV_XID_ERRORS) > 0
          labels: {severity: warning, tier: gpu}
          annotations: {summary: 'GPU {{ $labels.gpu }} on {{ $labels.Hostname }} reported XID {{ $value }}', description: 'XID codes indicate driver or hardware faults (e.g. 79 = fell off the bus). Look up the code before restarting workloads.'}
        - alert: GPUMemoryNearlyFull
          expr: max by (Hostname, gpu) (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) > 0.95
          for: 15m
          labels: {severity: warning, tier: gpu}
          annotations: {summary: 'GPU {{ $labels.gpu }} framebuffer {{ $value | humanizePercentage }} used'}
        - alert: GPUMetricsMissing
          expr: absent(DCGM_FI_DEV_GPU_TEMP)
          for: 15m
          labels: {severity: warning, tier: gpu}
          annotations: {summary: No DCGM metrics from the P40, description: 'dcgm-exporter down, or its ServiceMonitor disabled in the ClusterPolicy. GPU alerts are blind.'}
    - name: lab.controlplane
      rules:
        # Gaps seen in the 2026-11-08 outages: a control plane VM stayed "powered on, heartbeat
        # green" while its br-ex address was gone, and etcd ran on two members, so one drop meant a
        # full outage.
        - alert: ControlPlaneNodeUnreachable
          expr: (up{job="kubelet", metrics_path="/metrics", node=~"ocp-cp-.*"} == 0) or absent(up{job="kubelet", metrics_path="/metrics", node="ocp-cp-1.lab.ocp.lan"}) or absent(up{job="kubelet", metrics_path="/metrics", node="ocp-cp-2.lab.ocp.lan"}) or absent(up{job="kubelet", metrics_path="/metrics", node="ocp-cp-3.lab.ocp.lan"})
          for: 3m
          labels: {severity: critical, tier: controlplane}
          annotations: {summary: 'Control plane kubelet {{ $labels.node }} unreachable for 3m', description: 'Seen 2026-11-08: VM up, br-ex lost its IP. Check ping from ocp-svc; if VMware Tools is green but there is no ping, reboot the guest (AiChohort HOMELAB-RECOVERY.md step 4).'}
        - alert: EtcdBelowThreeMembers
          expr: count(etcd_server_has_leader == 1) < 3
          for: 5m
          labels: {severity: critical, tier: controlplane}
          annotations: {summary: 'Only {{ $value }} etcd member(s) healthy', description: 'With 2 members, losing either one stops the API. Restore the third before any maintenance.'}
        - alert: EtcdDiskFsyncVerySlow
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[10m]))) > 2
          for: 15m
          labels: {severity: critical, tier: controlplane}
          annotations: {summary: 'etcd WAL fsync p99 {{ $value | humanizeDuration }} on {{ $labels.instance }}', description: 'Measured 7-8 s on 2026-11-08 (target <10 ms). Leader elections and API timeouts follow. Single shared spinning datastore; see platform issue 005.'}
        - alert: KubeControllerManagerNoLeader
          expr: max(leader_election_master_status{name="kube-controller-manager"}) < 1 or absent(leader_election_master_status{name="kube-controller-manager"})
          for: 5m
          labels: {severity: critical, tier: controlplane}
          annotations: {summary: No kube-controller-manager holds its lease, description: 'Seen 2026-11-08: while no KCM leads, approved CSRs are never signed, so nodes cannot join or renew certificates, and controllers stop reconciling.'}
    - name: lab.logging
      rules:
        - alert: LokiDown
          expr: absent(up{namespace="lab-logging", job=~".*loki.*"} == 1)
          for: 10m
          labels: {severity: warning, tier: logging}
          annotations: {summary: Loki is not being scraped, description: Pod logs in Grafana are unavailable or stale.}
        - alert: LokiIngestErrors
          expr: sum(rate(loki_discarded_samples_total{namespace="lab-logging"}[10m])) > 0
          for: 15m
          labels: {severity: warning, tier: logging}
          annotations: {summary: 'Loki is discarding log lines ({{ $labels.reason }})', description: 'Usually rate limits or lines too old. Logs are being lost, not delayed.'}
        - alert: AlloyLogCollectorDown
          expr: absent(up{namespace="lab-logging", job=~".*alloy.*"} == 1)
          for: 10m
          labels: {severity: warning, tier: logging}
          annotations: {summary: The lab Alloy log collector is not being scraped, description: No new pod logs reach Loki.}
