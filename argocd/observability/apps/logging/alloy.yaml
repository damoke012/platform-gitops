# Grafana Alloy v1.21.3: pod logs and Kubernetes events -> lab Loki. Written 2026-11-08.
# Tails logs through the Kubernetes API (loki.source.kubernetes): no hostPath, no privileged SCC,
# runs under restricted-v2. The same pattern is used by the separate obs-sme-lab Alloy in
# namespace observability, which is NOT this one and is not changed.
# Cost: every tailed pod is a log stream through the API server. Scoped to app namespaces
# (openshift-*, kube-*, default dropped). Add openshift namespaces only once the control plane is
# healthy (issue 005).
---
apiVersion: v1
kind: ConfigMap
metadata: {name: alloy-config, namespace: lab-logging}
data:
  config.alloy: |
    logging { level = "warn" }

    discovery.kubernetes "pods" { role = "pod" }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "openshift-.*|kube-.*|default"
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Succeeded|Failed"
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
        separator     = ""
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      // Level for filtering in Grafana; best effort across common formats.
      stage.regex { expression = "(?i)\\b(?P<level>trace|debug|info|warn|warning|error|err|fatal|panic|critical)\\b" }
      stage.labels { values = { level = "" } }
      forward_to = [loki.write.lab.receiver]
    }

    loki.source.kubernetes_events "events" {
      log_format = "logfmt"
      forward_to = [loki.process.events.receiver]
    }

    loki.process "events" {
      stage.static_labels { values = { source = "k8s-events" } }
      forward_to = [loki.write.lab.receiver]
    }

    loki.write "lab" {
      endpoint { url = "http://loki.lab-logging.svc:3100/loki/api/v1/push" }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: alloy, namespace: lab-logging}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: lab-alloy-logs}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: lab-alloy-logs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lab-alloy-logs}
subjects: [{kind: ServiceAccount, name: alloy, namespace: lab-logging}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: lab-logging
  labels: {app.kubernetes.io/name: alloy}
spec:
  replicas: 1   # loki.source.kubernetes is not sharded here; a second replica would duplicate every line
  selector: {matchLabels: {app.kubernetes.io/name: alloy}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy}
      annotations: {config-hash: "v1"}
    spec:
      serviceAccountName: alloy
      imagePullSecrets: [{name: harbor-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alloy
          image: alloy
          args: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, --disable-reporting]
          ports: [{name: http, containerPort: 12345}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: alloy-config}}
        - {name: data, emptyDir: {sizeLimit: 512Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: lab-logging
  labels: {app.kubernetes.io/name: alloy}
spec:
  selector: {app.kubernetes.io/name: alloy}
  ports: [{name: http, port: 12345, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: alloy, namespace: lab-logging}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: alloy}}
  endpoints: [{port: http, path: /metrics, interval: 60s}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: lab-logging}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: loki-allow, namespace: lab-logging}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: loki}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}}]
      ports: [{port: 3100, protocol: TCP}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: obs-grafana}}}]
      ports: [{port: 3100, protocol: TCP}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-monitoring}}}]
      ports: [{port: 3100, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: alloy-allow, namespace: lab-logging}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-monitoring}}}]
      ports: [{port: 12345, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: loki}}}]
      ports: [{port: 3100, protocol: TCP}]
    - to:
        - {ipBlock: {cidr: 192.168.22.201/32}}
        - {ipBlock: {cidr: 192.168.22.202/32}}
        - {ipBlock: {cidr: 192.168.22.203/32}}
      ports: [{port: 6443, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-dns}}
          podSelector: {matchLabels: {dns.operator.openshift.io/daemonset-dns: default}}
      ports: [{port: 5353, protocol: UDP}, {port: 5353, protocol: TCP}]
