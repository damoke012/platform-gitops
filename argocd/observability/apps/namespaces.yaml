# Lab observability namespaces. Written 2026-11-08 (OCP 4.19.11 home lab). Synced by Argo CD
# Application lab-observability (bootstrap/application.yaml).
#
# argocd.argoproj.io/managed-by: OpenShift GitOps grants its controller rights only in namespaces
# carrying this label.
# openshift.io/cluster-monitoring: the PLATFORM Prometheus scrapes and evaluates rules here, so rules
# can see every namespace's kube-state-metrics, kubelet, cAdvisor and DCGM data. Red Hat does not
# support this label on non-openshift namespaces. It is used deliberately in this lab.
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-monitoring
  labels: {argocd.argoproj.io/managed-by: openshift-gitops, openshift.io/cluster-monitoring: "true"}
  annotations: {argocd.argoproj.io/sync-wave: "-10"}
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-certs
  labels: {argocd.argoproj.io/managed-by: openshift-gitops, openshift.io/cluster-monitoring: "true"}
  annotations: {argocd.argoproj.io/sync-wave: "-10"}
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-logging
  labels: {argocd.argoproj.io/managed-by: openshift-gitops, openshift.io/cluster-monitoring: "true"}
  annotations: {argocd.argoproj.io/sync-wave: "-10"}
---
# Grafana was first applied from AiChohort (scripts/45-grafana.sh). From here on Argo CD owns it.
# The secrets grafana-admin and harbor-pull stay out of git and are not managed.
apiVersion: v1
kind: Namespace
metadata:
  name: obs-grafana
  labels: {argocd.argoproj.io/managed-by: openshift-gitops}
  annotations: {argocd.argoproj.io/sync-wave: "-10"}
