    namespace: obs-grafana
    files:
      - dashboards/obs-agent.json
      - dashboards/gpu-p40.json
      - dashboards/lab-namespace.json
      - dashboards/lab-pod.json
      - dashboards/lab-kafka.json
      - dashboards/lab-harbor.json
      - dashboards/lab-postgres.json
